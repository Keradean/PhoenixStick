<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bühne Theme Sci-Fi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060A11}
a{color:#4FE3FF}a:hover{color:#A8F1FF}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; background: #060A11; color: #E8F6FF; font-family: 'Chakra Petch', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">

  <svg aria-hidden="true" width="1920" height="1080" viewBox="0 0 1920 1080" style="position: absolute; inset: 0">
    <defs>
      <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
        <path d="M48 0H0V48" fill="none" stroke="#4FE3FF" stroke-opacity="0.06" stroke-width="1"></path>
      </pattern>
    </defs>
    <rect width="1920" height="1080" fill="url(#grid)"></rect>
    <g transform="translate(1440 360)" fill="none" stroke="{{accent}}">
      <circle r="300" stroke-opacity="0.18" stroke-width="1"></circle>
      <circle r="230" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 10"></circle>
      <circle r="160" stroke-opacity="0.4" stroke-width="2"></circle>
      <circle r="92" stroke-opacity="0.55" stroke-width="1"></circle>
      <path d="M-340 0H-180M180 0H340M0 -340V-180M0 180V340" stroke-opacity="0.35" stroke-width="1"></path>
      <path d="M160 0A160 160 0 0 0 0 -160" stroke-opacity="0.95" stroke-width="4"></path>
      <path d="M-230 0A230 230 0 0 0 -163 163" stroke-opacity="0.7" stroke-width="3"></path>
      <circle r="6" fill="{{accent}}" stroke="none"></circle>
    </g>
    <path d="M0 704H1920" stroke="#4FE3FF" stroke-opacity="0.25" stroke-width="1"></path>
  </svg>

  <header style="position: relative; padding: 52px 96px 0; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: baseline; gap: 20px">
      <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 42px; font-weight: 500; font-variant-numeric: tabular-nums">20:15</p>
      <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 20px; color: #8FA3B8; letter-spacing: 0.12em">FR 30.10.2026</p>
    </div>
    <div style="display: flex; align-items: center; gap: 20px">
      <button aria-label="Einstellungen" style="width: 60px; height: 60px; border-radius: 4px; border: 1px solid rgba(79,227,255,0.45); background: rgba(79,227,255,0.06); color: #E8F6FF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
      </button>
      <button aria-label="Profil wechseln" style="width: 64px; height: 64px; border-radius: 4px; border: 2px solid {{accent}}; background: rgba(79,227,255,0.1); color: #E8F6FF; font-family: inherit; font-size: 28px; font-weight: 700">D</button>
    </div>
  </header>

  <div style="position: relative; padding: 150px 96px 0; width: 900px; display: flex; flex-direction: column; gap: 18px">
    <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 20px; color: {{accent}}; letter-spacing: 0.2em">// ZULETZT GEÖFFNET</p>
    <h1 style="margin: 0; font-size: 112px; font-weight: 700; letter-spacing: 0.01em; line-height: 1; text-transform: uppercase">Netflix</h1>
    <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 22px; color: #B5C6D6">Letzter Start vor 2 Std.</p>
    <div style="display: flex; gap: 20px; margin-top: 18px">
      <button style="height: 68px; padding: 0 44px; border: none; background: {{accent}}; color: #04121A; font-family: inherit; font-size: 26px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px)">Starten</button>
      <button style="height: 68px; padding: 0 36px; border: 1px solid rgba(79,227,255,0.5); background: rgba(6,10,17,0.6); color: #E8F6FF; font-family: inherit; font-size: 22px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">Aus Favoriten</button>
    </div>
  </div>

  <section style="position: relative; margin-top: auto; padding: 0 0 36px 96px; display: flex; flex-direction: column; gap: 20px">
    <h2 style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500; color: #8FA3B8; letter-spacing: 0.2em">DEINE APPS</h2>
    <div style="display: flex; gap: 28px">
      <button style="position: relative; flex: 0 0 300px; height: 168px; border-radius: 4px; border: 2px solid {{accent}}; background: rgba(79,227,255,0.14); color: #FFFFFF; font-family: inherit; font-size: 30px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; box-shadow: 0 0 36px rgba(79,227,255,0.45); transform: scale(1.06)">
        Netflix
        <span aria-hidden="true" style="position: absolute; top: -10px; left: -10px; width: 22px; height: 22px; border-top: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF"></span>
        <span aria-hidden="true" style="position: absolute; top: -10px; right: -10px; width: 22px; height: 22px; border-top: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF"></span>
        <span aria-hidden="true" style="position: absolute; bottom: -10px; left: -10px; width: 22px; height: 22px; border-bottom: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF"></span>
        <span aria-hidden="true" style="position: absolute; bottom: -10px; right: -10px; width: 22px; height: 22px; border-bottom: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF"></span>
      </button>
      <sc-for list="{{apps}}" as="app" hint-placeholder-count="6">
        <button style="flex: 0 0 300px; height: 168px; border-radius: 4px; border: 1px solid rgba(79,227,255,0.3); background: rgba(79,227,255,0.05); color: #CFE3F2; font-family: inherit; font-size: 26px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase">{{app}}</button>
      </sc-for>
    </div>
  </section>

  <footer style="position: relative; padding: 0 96px 40px; display: flex; gap: 40px; font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: #8FA3B8">
    <span><strong style="color: #E8F6FF">◀ ▶</strong> Apps durchgehen</span>
    <span><strong style="color: #E8F6FF">▲</strong> zur Bühne</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4FE3FF","options":["#4FE3FF","#7CFFB2","#FF5F7E","#B48CFF"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#4FE3FF',
      apps: ['Prime Video', 'YouTube', 'Disney+', 'Crunchyroll', 'HBO', 'Twitch']
    };
  }
}
</script>
</body>
</html>
