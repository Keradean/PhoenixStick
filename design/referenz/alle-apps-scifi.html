<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Raster Sci-Fi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060A11}
a{color:#4FE3FF}a:hover{color:#A8F1FF}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; background: #060A11; color: #E8F6FF; font-family: 'Chakra Petch', system-ui, sans-serif; overflow: hidden; display: flex">

  <svg aria-hidden="true" width="1920" height="1080" viewBox="0 0 1920 1080" style="position: absolute; inset: 0">
    <defs>
      <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
        <path d="M48 0H0V48" fill="none" stroke="#4FE3FF" stroke-opacity="0.06" stroke-width="1"></path>
      </pattern>
    </defs>
    <rect width="1920" height="1080" fill="url(#grid)"></rect>
  </svg>

  <nav aria-label="Hauptmenü" style="position: relative; width: 128px; box-sizing: border-box; padding: 48px 0 40px; background: #07101A; border-right: 1px solid rgba(79,227,255,0.25); display: flex; flex-direction: column; align-items: center; gap: 18px">
    <div style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; margin-bottom: 36px; color: {{accent}}">
      <svg role="img" aria-label="PhönixStick" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><path d="M24 42C24 30 18 22 8 18C16 18 22 22 24 28C26 20 32 12 42 8C34 16 30 24 30 32"></path><path d="M24 42C24 36 27 32 32 30"></path></svg>
    </div>
    <a href="#" aria-label="Start" style="width: 72px; height: 72px; border-radius: 4px; color: #8FA3B8; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M3 11l9-7 9 7v10H15v-6H9v6H3z"></path></svg>
    </a>
    <a href="#" aria-label="Favoriten" style="width: 72px; height: 72px; border-radius: 4px; color: #8FA3B8; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
    </a>
    <a href="#" aria-label="Alle Apps" style="position: relative; width: 72px; height: 72px; border-radius: 4px; border: 1px solid rgba(79,227,255,0.5); background: rgba(79,227,255,0.12); color: #E8F6FF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <span aria-hidden="true" style="position: absolute; left: -29px; top: 13px; width: 3px; height: 44px; background: {{accent}}"></span>
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
    </a>
    <a href="#" aria-label="Eingänge" style="width: 72px; height: 72px; border-radius: 4px; color: #8FA3B8; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><rect x="3" y="5" width="18" height="12"></rect><path d="M8 21h8M12 17v4"></path></svg>
    </a>
    <span aria-hidden="true" style="width: 40px; height: 1px; background: rgba(79,227,255,0.25); margin: 8px 0"></span>
    <a href="#" aria-label="Einstellungen" style="margin-top: auto; width: 72px; height: 72px; border-radius: 4px; color: #8FA3B8; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
    </a>
  </nav>

  <main style="position: relative; flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 44px 96px 36px 64px; display: flex; flex-direction: column; gap: 36px">

    <header style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 72px">
        <p style="margin: 0; font-size: 36px; font-weight: 700; letter-spacing: 0.12em">PHÖNIXSTICK<span style="color: {{accent}}">_</span></p>
        <div style="display: flex; gap: 48px; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 500; letter-spacing: 0.2em">
          <span style="color: #8FA3B8; padding-bottom: 10px">START</span>
          <span style="color: #8FA3B8; padding-bottom: 10px">FAVORITEN</span>
          <span style="color: {{accent}}; padding-bottom: 10px; border-bottom: 2px solid {{accent}}">ALLE APPS</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 24px">
        <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 42px; font-weight: 500; font-variant-numeric: tabular-nums">20:15</p>
        <button aria-label="Profil wechseln" style="width: 64px; height: 64px; border-radius: 4px; border: 2px solid {{accent}}; background: rgba(79,227,255,0.1); color: #E8F6FF; font-family: inherit; font-size: 28px; font-weight: 700">D</button>
      </div>
    </header>

    <section style="display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h1 style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500; color: #8FA3B8; letter-spacing: 0.2em">// FAVORITEN</h1>
        <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: #8FA3B8; letter-spacing: 0.2em">05 / 12</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px">
        <button style="position: relative; height: 172px; border-radius: 4px; border: 2px solid {{accent}}; background: rgba(79,227,255,0.14); color: #FFFFFF; font-family: inherit; font-size: 30px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; box-shadow: 0 0 36px rgba(79,227,255,0.45); transform: scale(1.06)">
          Netflix
          <span aria-hidden="true" style="position: absolute; top: -10px; left: -10px; width: 22px; height: 22px; border-top: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF"></span>
          <span aria-hidden="true" style="position: absolute; top: -10px; right: -10px; width: 22px; height: 22px; border-top: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF"></span>
          <span aria-hidden="true" style="position: absolute; bottom: -10px; left: -10px; width: 22px; height: 22px; border-bottom: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF"></span>
          <span aria-hidden="true" style="position: absolute; bottom: -10px; right: -10px; width: 22px; height: 22px; border-bottom: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF"></span>
          <span style="position: absolute; top: 12px; left: 12px; padding: 3px 8px; background: {{accent}}; color: #04121A; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.16em">ZULETZT</span>
        </button>
        <sc-for list="{{favorites}}" as="app" hint-placeholder-count="4">
          <button style="height: 172px; border-radius: 4px; border: 1px solid rgba(79,227,255,0.3); background: rgba(79,227,255,0.05); color: #CFE3F2; font-family: inherit; font-size: 26px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase">{{app}}</button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding-top: 18px; border-top: 1px solid rgba(79,227,255,0.25)">
        <h2 style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500; color: #8FA3B8; letter-spacing: 0.2em">// ALLE APPS · A–Z</h2>
        <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: #8FA3B8; letter-spacing: 0.2em">12 INSTALLIERT</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 24px">
        <sc-for list="{{allApps}}" as="app" hint-placeholder-count="12">
          <button style="height: 140px; border-radius: 4px; border: 1px solid rgba(79,227,255,0.22); background: rgba(79,227,255,0.035); color: #CFE3F2; font-family: inherit; font-size: 22px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase">{{app}}</button>
        </sc-for>
      </div>
    </section>

    <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; gap: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; letter-spacing: 0.2em">
        <span style="padding: 12px 24px; border-radius: 2px; border: 1px solid {{accent}}; color: {{accent}}; background: rgba(79,227,255,0.12)">ALLE</span>
        <span style="padding: 12px 24px; border-radius: 2px; border: 1px solid rgba(79,227,255,0.35); color: #8FA3B8">STREAMING</span>
        <span style="padding: 12px 24px; border-radius: 2px; border: 1px solid rgba(79,227,255,0.35); color: #8FA3B8">MEDIATHEKEN</span>
        <span style="padding: 12px 24px; border-radius: 2px; border: 1px solid rgba(79,227,255,0.35); color: #8FA3B8">ANIME</span>
        <span style="padding: 12px 24px; border-radius: 2px; border: 1px solid rgba(79,227,255,0.35); color: #8FA3B8">KIDS</span>
        <span style="padding: 12px 24px; border-radius: 2px; border: 1px solid rgba(79,227,255,0.35); color: #8FA3B8">LIVE</span>
      </div>
      <p style="margin: 0; display: flex; gap: 32px; font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: #8FA3B8">
        <span><strong style="color: #E8F6FF">OK</strong> starten</span>
        <span><strong style="color: #E8F6FF">MENÜ</strong> Favorit</span>
      </p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4FE3FF","options":["#4FE3FF","#7CFFB2","#FF5F7E","#B48CFF"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#4FE3FF',
      favorites: ['Prime Video', 'YouTube', 'Disney+', 'Crunchyroll'],
      allApps: ['7TV', 'ARD', 'Crunchyroll', 'Disney+', 'DMAX', 'HBO', 'Netflix', 'Prime Video', 'Toggo', 'Twitch', 'YouTube', 'ZDF']
    };
  }
}
</script>
</body>
</html>
