<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Variante B Bühne Phönix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120C0A}
a{color:#FF7A3D}a:hover{color:#FFC14D}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; background: #120C0A; color: #F7EFE8; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="position: relative; height: 700px; display: flex; overflow: hidden">
    <div style="position: absolute; top: 0; right: 0; width: 1180px; height: 700px; background: #1A120F">
      <svg aria-hidden="true" width="1180" height="700" viewBox="0 0 1180 700" style="position: absolute; inset: 0">
        <g fill="none" stroke-linecap="round">
          <path d="M520 700C560 520 700 380 900 320" stroke="{{accent}}" stroke-opacity="0.55" stroke-width="3"></path>
          <path d="M560 700C610 540 760 420 980 380" stroke="{{accent}}" stroke-opacity="0.4" stroke-width="3"></path>
          <path d="M600 700C660 560 820 470 1060 450" stroke="{{gold}}" stroke-opacity="0.35" stroke-width="3"></path>
          <path d="M480 700C500 500 620 330 800 250" stroke="{{gold}}" stroke-opacity="0.5" stroke-width="3"></path>
          <path d="M440 700C440 480 530 290 690 180" stroke="{{accent}}" stroke-opacity="0.3" stroke-width="2"></path>
        </g>
        <g fill="{{gold}}">
          <circle cx="760" cy="200" r="5" fill-opacity="0.9"></circle>
          <circle cx="880" cy="150" r="3" fill-opacity="0.7"></circle>
          <circle cx="980" cy="260" r="4" fill-opacity="0.6"></circle>
          <circle cx="700" cy="110" r="2.5" fill-opacity="0.8"></circle>
          <circle cx="1040" cy="170" r="2" fill-opacity="0.5"></circle>
          <circle cx="840" cy="70" r="3.5" fill-opacity="0.45"></circle>
        </g>
        <g fill="{{accent}}">
          <circle cx="920" cy="330" r="4" fill-opacity="0.7"></circle>
          <circle cx="1080" cy="300" r="3" fill-opacity="0.5"></circle>
          <circle cx="640" cy="240" r="2.5" fill-opacity="0.6"></circle>
        </g>
      </svg>
    </div>
    <div style="position: absolute; top: 0; left: 0; width: 1100px; height: 700px; background: #120C0A; clip-path: polygon(0 0, 100% 0, 72% 100%, 0 100%)"></div>

    <header style="position: absolute; top: 56px; left: 96px; right: 96px; display: flex; align-items: center; justify-content: space-between">
      <p style="margin: 0; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{gold}}">20:15 <span style="font-size: 22px; font-weight: 600; color: #B3A79E; margin-left: 12px">Fr, 30. Okt</span></p>
      <div style="display: flex; align-items: center; gap: 20px">
        <button aria-label="Einstellungen" style="width: 60px; height: 60px; border-radius: 30px; border: none; background: rgba(18,12,10,0.75); color: #EFE4DA; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
        </button>
        <button aria-label="Profil wechseln" style="width: 68px; height: 68px; border-radius: 34px; border: 3px solid {{gold}}; background: #261B16; color: #F7EFE8; font-family: inherit; font-size: 28px; font-weight: 800">D</button>
      </div>
    </header>

    <div style="position: absolute; left: 96px; top: 250px; width: 760px; display: flex; flex-direction: column; gap: 20px">
      <p style="margin: 0; font-size: 22px; font-weight: 700; color: {{accent}}; letter-spacing: 0.08em">ZULETZT GEÖFFNET</p>
      <h1 style="margin: 0; font-size: 104px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Netflix</h1>
      <p style="margin: 0; font-size: 26px; color: #D9CCC2">Vor 2 Stunden geöffnet</p>
      <div style="display: flex; gap: 20px; margin-top: 16px">
        <button style="height: 72px; padding: 0 40px; border-radius: 36px; border: none; background: #F7EFE8; color: #120C0A; font-family: inherit; font-size: 26px; font-weight: 800; box-shadow: 0 0 0 4px {{accent}}">Öffnen</button>
        <button style="height: 72px; padding: 0 36px; border-radius: 36px; border: 2px solid #4A3A32; background: transparent; color: #EFE4DA; font-family: inherit; font-size: 24px; font-weight: 700">Aus Favoriten entfernen</button>
      </div>
    </div>
  </div>

  <section style="padding: 36px 0 0 96px; display: flex; flex-direction: column; gap: 22px">
    <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #D9CCC2">Deine Apps</h2>
    <div style="display: flex; gap: 28px">
      <button style="flex: 0 0 300px; height: 168px; border-radius: 18px; border: none; background: #2C201B; color: #FFFFFF; font-family: inherit; font-size: 30px; font-weight: 800; box-shadow: 0 0 0 5px #FFE2B8, 0 20px 44px rgba(0,0,0,0.6), 0 0 40px rgba(255,122,61,0.35)">Netflix</button>
      <sc-for list="{{apps}}" as="app" hint-placeholder-count="6">
        <button style="flex: 0 0 300px; height: 168px; border-radius: 18px; border: none; background: #1E1613; color: #EFE4DA; font-family: inherit; font-size: 28px; font-weight: 700">{{app}}</button>
      </sc-for>
    </div>
  </section>

  <footer style="margin-top: auto; padding: 0 96px 44px; display: flex; gap: 40px; font-size: 20px; color: #B3A79E">
    <span><strong style="color: #EFE4DA">Links / Rechts</strong> durch die Apps</span>
    <span><strong style="color: #EFE4DA">Hoch</strong> zur Bühne</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A3D","options":["#FF7A3D","#D9383A","#FF9E5E"]},"gold":{"editor":"color","default":"#FFC14D","options":["#FFC14D","#FFD98A","#E8A33A"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FF7A3D',
      gold: this.props.gold ?? '#FFC14D',
      apps: ['Prime Video', 'YouTube', 'Disney+', 'Crunchyroll', 'HBO', 'Twitch']
    };
  }
}
</script>
</body>
</html>
