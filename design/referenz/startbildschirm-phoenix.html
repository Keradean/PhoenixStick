<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kino-Look</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A0A}
a{color:#E5322D}a:hover{color:#FF6A5F}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; background: #0B0A0A; color: #F2EDEA; font-family: 'Manrope', system-ui, sans-serif; display: flex">

  <nav aria-label="Hauptmenü" style="width: 128px; box-sizing: border-box; padding: 48px 0 40px; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; align-items: center; gap: 18px">
    <div style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; margin-bottom: 36px; color: {{accent}}">
      <svg role="img" aria-label="PhönixStick" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 42C24 30 18 22 8 18C16 18 22 22 24 28C26 20 32 12 42 8C34 16 30 24 30 32"></path><path d="M24 42C24 36 27 32 32 30"></path><circle cx="35" cy="20" r="1.6" fill="currentColor"></circle></svg>
    </div>
    <a href="#" aria-label="Start" style="position: relative; width: 72px; height: 72px; border-radius: 16px; background: rgba(229,50,45,0.12); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <span aria-hidden="true" style="position: absolute; left: -28px; top: 14px; width: 4px; height: 44px; border-radius: 2px; background: {{accent}}"></span>
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
    </a>
    <a href="#" aria-label="Favoriten" style="width: 72px; height: 72px; border-radius: 16px; color: #A39A96; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
    </a>
    <a href="#" aria-label="Alle Apps" style="width: 72px; height: 72px; border-radius: 16px; color: #A39A96; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
    </a>
    <a href="#" aria-label="Eingänge" style="width: 72px; height: 72px; border-radius: 16px; color: #A39A96; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
    </a>
    <span aria-hidden="true" style="width: 40px; height: 1px; background: rgba(255,255,255,0.1); margin: 8px 0"></span>
    <a href="#" aria-label="Einstellungen" style="margin-top: auto; width: 72px; height: 72px; border-radius: 16px; color: #A39A96; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
    </a>
  </nav>

  <main style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 44px 0 36px 64px; display: flex; flex-direction: column; gap: 32px">

    <header style="padding-right: 96px; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 72px">
        <p style="margin: 0; font-family: 'Antonio', sans-serif; font-size: 40px; font-weight: 400; letter-spacing: 0.06em">PHÖNIXSTICK<span style="color: {{accent}}">.</span></p>
        <div style="display: flex; gap: 48px; font-size: 18px; font-weight: 600; letter-spacing: 0.18em">
          <span style="color: {{accent}}; padding-bottom: 10px; border-bottom: 2px solid {{accent}}">START</span>
          <span style="color: #A39A96; padding-bottom: 10px">FAVORITEN</span>
          <span style="color: #A39A96; padding-bottom: 10px">ALLE APPS</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 28px">
        <p style="margin: 0; font-family: 'Antonio', sans-serif; font-size: 40px; font-weight: 400; font-variant-numeric: tabular-nums">20:15</p>
        <button aria-label="Profil wechseln" style="width: 64px; height: 64px; border-radius: 32px; border: 2px solid rgba(255,255,255,0.18); background: #1C1817; color: #F2EDEA; font-family: 'Antonio', sans-serif; font-size: 28px; font-weight: 600">D</button>
      </div>
    </header>

    <section aria-label="Bühne" style="position: relative; margin-right: 96px; height: 480px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.08); background: #120F0F; overflow: hidden">
      <svg aria-hidden="true" width="1632" height="480" viewBox="0 0 1632 480" style="position: absolute; inset: 0">
        <circle cx="1220" cy="200" r="150" fill="{{accent}}" fill-opacity="0.16"></circle>
        <circle cx="1220" cy="200" r="96" fill="{{accent}}" fill-opacity="0.28"></circle>
        <g fill="none" stroke-linecap="round">
          <path d="M860 480C900 340 1020 250 1220 220" stroke="{{accent}}" stroke-opacity="0.75" stroke-width="3"></path>
          <path d="M920 480C970 360 1100 290 1320 280" stroke="{{accent}}" stroke-opacity="0.5" stroke-width="3"></path>
          <path d="M980 480C1040 390 1180 340 1420 340" stroke="{{accent}}" stroke-opacity="0.35" stroke-width="3"></path>
          <path d="M800 480C820 330 920 200 1080 130" stroke="#F2EDEA" stroke-opacity="0.25" stroke-width="2"></path>
        </g>
        <g stroke="#F2EDEA" stroke-opacity="0.07" stroke-width="1.5">
          <path d="M1000 0L960 120M1080 20L1040 140M1160 0L1120 120M1260 30L1220 150M1360 0L1320 120M1460 40L1420 160M1540 0L1500 120"></path>
        </g>
        <g fill="#FF8A70">
          <circle cx="1340" cy="150" r="3" fill-opacity="0.8"></circle>
          <circle cx="1100" cy="120" r="2.5" fill-opacity="0.6"></circle>
          <circle cx="1400" cy="250" r="2" fill-opacity="0.5"></circle>
        </g>
      </svg>
      <div aria-hidden="true" style="position: absolute; inset: 0; width: 900px; background: #120F0F; clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%); opacity: 0.92"></div>

      <div style="position: absolute; left: 72px; top: 72px; width: 760px; display: flex; flex-direction: column; gap: 16px">
        <p style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.2em; color: {{accent}}">ZULETZT GEÖFFNET</p>
        <h1 style="margin: 0; font-family: 'Antonio', sans-serif; font-size: 132px; font-weight: 300; line-height: 0.95; letter-spacing: 0.02em">NETFLIX</h1>
        <p style="margin: 0; font-size: 26px; color: #D8CFCB">Deine zuletzt gestartete App.</p>
        <p style="margin: 0; display: flex; gap: 18px; align-items: center; font-size: 18px; color: #A39A96; letter-spacing: 0.06em">
          <span>VOR 2 STD.</span><span>·</span><span>STREAMING</span><span style="padding: 4px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.18)">Favorit</span>
        </p>
        <div style="display: flex; gap: 20px; align-items: center; margin-top: 18px">
          <button style="height: 68px; padding: 0 40px; border-radius: 12px; border: none; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 20px; font-weight: 700; letter-spacing: 0.16em; display: flex; align-items: center; gap: 14px; box-shadow: 0 0 0 4px #F2EDEA, 0 0 40px rgba(229,50,45,0.5)">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"></path></svg>
            ÖFFNEN
          </button>
          <button aria-label="Aus Favoriten entfernen" style="width: 68px; height: 68px; border-radius: 34px; border: 1px solid rgba(255,255,255,0.25); background: transparent; color: #F2EDEA; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg>
          </button>
        </div>
      </div>
      <div aria-hidden="true" style="position: absolute; right: 48px; bottom: 36px; display: flex; gap: 10px">
        <span style="width: 28px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
        <span style="width: 28px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.7)"></span>
        <span style="width: 28px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25)"></span>
        <span style="width: 28px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25)"></span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 18px">
      <div style="padding-right: 96px; display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-family: 'Antonio', sans-serif; font-size: 30px; font-weight: 400; letter-spacing: 0.16em">DEINE APPS</h2>
        <p style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.16em; color: #A39A96">ALLE ANZEIGEN <span style="color: {{accent}}">›</span></p>
      </div>
      <div style="display: flex; gap: 24px">
        <button style="position: relative; flex: 0 0 340px; height: 190px; border-radius: 16px; border: 2px solid {{accent}}; background: #1C1615; color: #FFFFFF; font-family: 'Antonio', sans-serif; font-size: 38px; font-weight: 400; letter-spacing: 0.08em; box-shadow: 0 0 36px rgba(229,50,45,0.45); transform: scale(1.05)">
          <span style="position: absolute; top: 14px; left: 14px; padding: 4px 10px; border-radius: 4px; background: {{accent}}; font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em">ZULETZT</span>
          NETFLIX
        </button>
        <sc-for list="{{apps}}" as="app" hint-placeholder-count="5">
          <button style="flex: 0 0 340px; height: 190px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); background: #151212; color: #E4DCD8; font-family: 'Antonio', sans-serif; font-size: 34px; font-weight: 400; letter-spacing: 0.08em">{{app}}</button>
        </sc-for>
      </div>
    </section>

    <div style="margin-top: auto; display: flex; gap: 16px; font-size: 16px; font-weight: 700; letter-spacing: 0.16em">
      <span style="padding: 14px 28px; border-radius: 30px; border: 1px solid {{accent}}; color: {{accent}}; background: rgba(229,50,45,0.1)">ALLE</span>
      <span style="padding: 14px 28px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.14); color: #A39A96">STREAMING</span>
      <span style="padding: 14px 28px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.14); color: #A39A96">MEDIATHEKEN</span>
      <span style="padding: 14px 28px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.14); color: #A39A96">ANIME</span>
      <span style="padding: 14px 28px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.14); color: #A39A96">KIDS</span>
      <span style="padding: 14px 28px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.14); color: #A39A96">LIVE</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E5322D","options":["#E5322D","#FF7A3D","#C9A227","#4FE3FF"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#E5322D',
      apps: ['PRIME VIDEO', 'YOUTUBE', 'DISNEY+', 'CRUNCHYROLL', 'HBO']
    };
  }
}
</script>
</body>
</html>
